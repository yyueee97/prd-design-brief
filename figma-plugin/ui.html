<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        color: #171321;
        font: 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 15px;
      }

      p {
        margin: 0 0 12px;
        color: #6b6575;
        line-height: 1.5;
      }

      textarea {
        width: 100%;
        height: 260px;
        box-sizing: border-box;
        border: 1px solid #d8d1e6;
        border-radius: 6px;
        padding: 10px;
        resize: vertical;
        font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      button {
        width: 100%;
        height: 38px;
        margin-top: 12px;
        border: 0;
        border-radius: 6px;
        background: #7c3aed;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      .error {
        min-height: 18px;
        margin-top: 8px;
        color: #9a5d00;
      }
    </style>
  </head>
  <body>
    <h1>PRD to UX Wireframes</h1>
    <p>从网页复制 Figma 数据后粘贴到这里，会在当前 Figma 文件里生成 UX Brief 页面和低保真画板。</p>
    <textarea id="payload" placeholder="Paste Figma payload JSON"></textarea>
    <button id="create">生成到当前文件</button>
    <div class="error" id="error"></div>

    <script>
      const textarea = document.querySelector("#payload");
      const error = document.querySelector("#error");

      document.querySelector("#create").onclick = () => {
        error.textContent = "";
        try {
          const payload = JSON.parse(textarea.value);
          parent.postMessage({ pluginMessage: { type: "create-wireframes", payload } }, "*");
        } catch {
          error.textContent = "JSON 格式不正确";
        }
      };
    </script>
  </body>
</html>
